<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register — Electro</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { width: 100%; max-width: 380px; }
        .login-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
        }
        .login-sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 2rem; }
        .field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
        .field label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
        .field input { width: 100%; }
        .error-msg {
            background: rgba(255,101,132,0.1);
            border: 1px solid rgba(255,101,132,0.3);
            color: var(--accent2);
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .btn-login { width: 100%; justify-content: center; padding: 0.75rem; font-size: 1rem; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card card">
        <div class="login-title">⚡ Electro<span style="color:var(--accent)">.</span></div>
        <div class="login-sub">Buat akun baru</div>

        <div class="error-msg" th:if="${error}" th:text="${error}"></div>
        <div class="error-msg" th:if="${param.registered}" style="background:rgba(0,200,100,0.1); border-color:rgba(0,200,100,0.3); color:#00c864;">
             Registrasi berhasil! Silakan login.
    </div>
        <form th:action="@{/register}" method="post">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" placeholder="Masukkan username" required />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="Masukkan password" required style="width:100%; box-sizing:border-box;" />
            </div>
            <div class="field">
                <label>Konfirmasi Password</label>
                <input type="password" name="confirmPassword" placeholder="Ulangi password" required style="width:100%; box-sizing:border-box;" />
            </div>
            <button type="submit" class="btn btn-primary btn-login">Daftar</button>
        </form>

        <div style="text-align:center; margin-top:1.2rem; font-size:0.875rem; color:var(--muted);">
            Sudah punya akun?
            <a href="/login" style="color:var(--accent); font-weight:600; text-decoration:none;">Masuk di sini</a>
        </div>
    </div>
</div>
</body>
</html>
