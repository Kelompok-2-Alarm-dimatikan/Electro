<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register — Electro</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<div class="login-wrap">
    <div class="login-card card">
        <div class="login-title">⚡ Electro<span style="color:var(--accent)">.</span></div>
        <div class="login-sub">Buat akun baru</div>

        <div class="error-msg" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" placeholder="Masukkan username" required />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="Masukkan password" required />
            </div>
            <div class="field">
                <label>Konfirmasi Password</label>
                <input type="password" name="confirmPassword" placeholder="Masukkan password" required />
            </div>
            <button type="submit" class="btn btn-primary btn-login">Daftar</button>
        </form>

        <div class="auth-footer">
            Sudah punya akun?
            <a href="/login">Masuk di sini</a>
        </div>
    </div>
</div>
</body>
</html>
