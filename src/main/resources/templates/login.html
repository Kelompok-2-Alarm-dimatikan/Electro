<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — Electro</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-wrap">
    <div class="login-card card">
        <div class="login-title">⚡ Electro<span style="color:var(--accent)">.</span></div>
        <div class="login-sub">Masuk ke akun kamu</div>

        <div class="error-msg" th:if="${param.error}">
            Username atau password salah!
        </div>

        <div class="success-msg" th:if="${param.registered}">
            Registrasi berhasil! Silakan login.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" placeholder="Masukkan username" required />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="Masukkan password" required />
            </div>
            <button type="submit" class="btn btn-primary btn-login">Masuk</button>
        </form>

        <div class="auth-footer">
            Belum punya akun?
            <a href="/register">Daftar di sini</a>
        </div>
    </div>
</div>
</body>
</html>
