<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Electro</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Login.css}">
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="auth-wrapper">
        <div class="auth-card animate-up">
            <div class="auth-header">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
                    Electro
                </div>
                <p class="auth-subtitle">Masuk ke akun Anda</p>
            </div>
            <div class="error-msg" th:if="${error}" th:text="${error}"></div>
            <div class="success-msg" th:if="${param.deleted}" th:text="'Akun Anda berhasil dihapus.'"></div>
            <form th:action="@{/login}" method="post" class="auth-form">
                <div class="field">
                    <label>Username atau Email</label>
                    <input type="text" name="username" placeholder="Masukkan username atau email" required autocomplete="off" />
                </div>
                <div class="field">
                    <label>Password</label>
                    <div class="input-icon-wrap">
                        <input type="password" id="passwordInput" name="password" placeholder="Masukkan password" required />
                        <button type="button" class="toggle-password" onclick="togglePassword('passwordInput', this)" aria-label="Toggle password visibility">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Sign In</button>
            </form>

            <div class="divider"><span>atau lanjutkan dengan</span></div>

            <a href="/oauth2/authorization/google" class="btn btn-outline btn-full btn-google">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20" />
                Google
            </a>

            <div class="auth-footer">
                Belum punya akun? <a href="/register">Daftar sekarang</a>
            </div>
        </div>
    </div>
    <script src="/js/login.js"></script>
</body>
</html>
