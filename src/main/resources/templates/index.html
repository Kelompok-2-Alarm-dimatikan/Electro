<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electro — Device Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    
<!-- ===== NAVBAR ===== -->
<header>
    <div class="header-left">
        <div class="logo">⚡ Electro<span>.</span></div>
        <span class="logo-badge">Data device</span>
    </div>
    <nav class="header-nav">
        <a href="#" class="nav-link active">Home</a>
        <a href="#" class="nav-link">Produk</a>
        <a href="#" class="nav-link">Promo</a>
    </nav>

    <!-- Profile -->
    <div class="header-right">
        <div class="profile-wrap" id="profileWrap">
            <button class="profile-btn" onclick="toggleProfile()" aria-label="Profile menu">
                <div class="profile-avatar">
                    <span th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                </div>
                <span class="profile-name" th:text="${#authentication.name}">User</span>
                <svg class="profile-chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>

            <!-- Dropdown -->
            <div class="profile-dropdown" id="profileDropdown">
                <div class="dropdown-header">
                    <div class="dropdown-avatar">
                        <span th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                    </div>
                    <div>
                        <div class="dropdown-name" th:text="${#authentication.name}">User</div>
                        <div class="dropdown-role">Member</div>
                    </div>
                </div>
                <div class="dropdown-divider"></div>
                <a href="#" class="dropdown-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                    Profil Saya
                </a>
                <a href="#" class="dropdown-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    Pengaturan
                </a>
                <div class="dropdown-divider"></div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="dropdown-item dropdown-logout">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Keluar
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="top-grid">

        <!-- TAMBAH DEVICE -->
        <div class="card">
            <div class="section-title">➕ Tambah Device</div>
            <form action="/devices/tambah" method="post">
                <div class="form-row">
                    <select name="kategori">
                        <option>Hp</option>
                        <option>Laptop</option>
                        <option>Tablet</option>
                    </select>
                    <input type="text" name="nama" placeholder="Nama device" required />
                    <input type="number" name="harga" placeholder="Harga" step="0.01" required />
                    <button type="submit" class="btn btn-primary">Tambah</button>
                </div>
            </form>
        </div>

        <!-- CARI / URUTKAN -->
        <div class="card">
            <div class="section-title">🔍 Cari / Urutkan</div>
            <form action="/devices/search" method="get">
                <div class="form-row">
                    <input type="number" name="harga" placeholder="Masukkan harga..." step="0.01" style="flex:1;" />
                    <button type="submit" class="btn btn-primary">Cari</button>
                </div>
            </form>
            <div class="search-actions">
                <a href="/devices/sort" class="btn btn-ghost">↑↓ Urutkan by Harga</a>
                <a href="/devices" class="btn btn-ghost">↺ Tampilkan Semua</a>
            </div>
        </div>

    </div>

        <!-- STATS -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-dot" style="background: var(--hp);"></div>
            <div class="stat-info">
                <div class="stat-label">Total HP</div>
                <div class="stat-value" th:text="${#lists.size(devices.?[kategori == 'Hp'])}">–</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-dot" style="background: var(--laptop);"></div>
            <div class="stat-info">
                <div class="stat-label">Total Laptop</div>
                <div class="stat-value" th:text="${#lists.size(devices.?[kategori == 'Laptop'])}">–</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-dot" style="background: var(--tablet);"></div>
            <div class="stat-info">
                <div class="stat-label">Total Tablet</div>
                <div class="stat-value" th:text="${#lists.size(devices.?[kategori == 'Tablet'])}">–</div>
            </div>
        </div>
    </div>

    <!-- TABLE -->
    <div class="table-header">
        <div class="section-title" style="margin:0">📋 List Device</div>
        <span class="table-count" th:text="${devices.size()} + ' device'">0 device</span>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Kategori</th>
                    <th>Nama</th>
                    <th>Harga</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <!-- Empty state -->
                <tr th:if="${devices.isEmpty()}">
                    <td colspan="5">
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <p>Belum ada device. Tambahkan yang pertama!</p>
                        </div>
                    </td>
                </tr>

                <tr th:each="d, stat : ${devices}">
                    <td class="td-no" th:text="${stat.count}"></td>

                    <td>
                        <span class="badge"
                              th:classappend="${d.kategori == 'Hp'} ? 'badge-hp' : (${d.kategori == 'Laptop'} ? 'badge-laptop' : 'badge-tablet')"
                              th:text="${d.kategori}"></span>
                    </td>

                    <td th:text="${d.nama}"></td>

                    <td class="harga-cell">
                        Rp <span th:text="${#numbers.formatInteger(d.harga, 1, 'COMMA')}"></span>
                    </td>

                    <td>
                        <div class="aksi-form" th:id="'row-' + ${d.id}">
                            <!-- Tombol Edit (toggle) -->
                            <button type="button" class="btn btn-edit"
                                    th:onclick="'toggleEdit(' + ${d.id} + ')'">Edit</button>

                            <!-- Hapus -->
                            <a th:href="@{/devices/hapus/{id}(id=${d.id})}"
                               class="btn btn-danger"
                               onclick="return confirm('Hapus device ini?')">Hapus</a>
                        </div>

                        <!-- Form Edit (hidden, muncul saat klik Edit) -->
                        <div class="edit-inputs" th:id="'edit-' + ${d.id}">
                            <form action="/devices/edit" method="post" style="display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap;">
                                <input type="hidden" name="id" th:value="${d.id}" />
                                <input type="text"   name="nama"  th:value="${d.nama}"  required />
                                <input type="number" name="harga" th:value="${d.harga}" step="0.01" required />
                                <button type="submit" class="btn btn-primary" style="padding:0.35rem 0.8rem;font-size:0.8rem;">Simpan</button>
                                <button type="button" class="btn btn-ghost"
                                        th:onclick="'toggleEdit(' + ${d.id} + ')'"
                                        style="padding:0.35rem 0.8rem;font-size:0.8rem;">Batal</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
